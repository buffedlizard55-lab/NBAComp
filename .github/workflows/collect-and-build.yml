name: collect-and-build

# Autonomous data collection + strategy pipeline + site build.
# Runs on schedule (every 6h), on demand, and on push (skipping its own commits).
concurrency:
  group: nbacomp
  cancel-in-progress: false

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run full multi-season backfill first (slow, ~40min)"
        default: "false"
  push:
    paths-ignore:
      - "data/**"
      - "index.html"
      - "leaderboard.html"
      - "strategies.html"
      - "upcoming.html"
      - "positions.html"
      - "history.html"
      - "sources.html"
      - "research.html"
      - "methodology.html"
      - "style.css"
      - "data/history.json"

permissions:
  contents: write

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Record run start (UTC)
        run: echo "RUN_START=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skip auto-commits
        id: skip
        run: |
          # Fixed-string match (-F): the old --grep='\[auto\]' regex collapsed
          # into a character class and matched nearly EVERY commit, so all of
          # 2026-09-21's runs silently took the probe-only path (daily
          # collection + pipeline never executed). Verified by job-step audit.
          if git log -1 --format=%s | grep -qF '[auto]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          if git log -1 --format=%s | grep -qF '[probe]'; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deep probe only (fast iteration)
        if: steps.skip.outputs.probe == 'true'
        continue-on-error: true
        run: |
          python tools/probe_deep.py || true
          python tools/probe_kalshi_events.py || true
          python tools/probe_settled_history.py || true

      - name: Commit probe results
        if: steps.skip.outputs.probe == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics.txt || true
          git commit -m "[auto] deep probe $(date -u +%FT%TZ)" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin HEAD || (sleep 30 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD) || true

      - name: Full backfill part 1 — schedule/results (two seasons)
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        run: |
          python -m nbacomp.collect backfill-days --start 20241001 --end 20250701
          python -m nbacomp.collect backfill-days --start 20251001 --end "$(date -u +%Y%m%d)"

      - name: Full backfill part 1b — Basketball-Reference schedule/results
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        continue-on-error: true
        run: |
          # Tokens are season-END-year:month. Oct-Dec of calendar year Y belong
          # to the season ending Y+1 (verified against
          # nbacomp.sources.bref.calendar_year_for): "2025:october" is
          # calendar 2024-10 and "2025:june" is 2025-06, so block 1 is exactly
          # the 2024-25 season and block 2 the 2025-26 season. "2027:october"
          # is calendar 2026-10 (the 2026-27 openers) and 404s until that page
          # exists, hence `|| true`.
          python -m nbacomp.collect backfill-bref-months --months "2025:october,2025:november,2025:december,2025:january,2025:february,2025:march,2025:april,2025:may,2025:june"
          python -m nbacomp.collect backfill-bref-months --months "2026:october,2026:november,2026:december,2026:january,2026:february,2026:march,2026:april,2026:may,2026:june"
          python -m nbacomp.collect backfill-bref-months --months "2027:october" || true

      - name: Full backfill part 2 — independent verification (Basketball-Reference)
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        continue-on-error: true
        run: |
          python -m nbacomp.collect verify-bref-months --months "2025:october,2025:november,2025:december,2025:january,2025:february,2025:march,2025:april,2025:may,2025:june"
          python -m nbacomp.collect verify-bref-months --months "2026:october,2026:november,2026:december,2026:january,2026:february,2026:march,2026:april,2026:may,2026:june"

      - name: Full backfill part 3 — Kalshi history (discovery, settled events, candles)
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        continue-on-error: true
        run: |
          python -m nbacomp.collect kalshi-discovery
          python -m nbacomp.collect kalshi-backfill
          python -m nbacomp.collect kalshi-candles --series KXNBAGAME --start 2024-10-01T00:00:00Z --end "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Full backfill part 4 — box scores 2025-26 (player + team logs)
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        continue-on-error: true
        run: |
          python -m nbacomp.collect boxscores --start 20251001 --end 20260715

      - name: Full backfill part 5 — box scores 2024-25 (player + team logs)
        if: steps.skip.outputs.skip != 'true' && inputs.backfill == 'true'
        continue-on-error: true
        run: |
          python -m nbacomp.collect boxscores --start 20241001 --end 20250715

      - name: Bootstrap history (only while the games table is empty)
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # One Basketball-Reference monthly page per request yields a whole
          # month of schedule + finals, so two seasons cost ~18 requests. This
          # runs ONLY while games is empty: without it a fresh database stayed
          # at 0 games forever, because the multi-season backfill below is
          # gated behind the manual workflow_dispatch input the cron never
          # sets (defect found 2026-09-21: backtest logged "no games in
          # window" on every run).
          N=$(python tools/db_game_count.py)
          echo "games before bootstrap: $N"
          if [ "$N" = "0" ]; then
            python -m nbacomp.collect backfill-bref-months --months "2025:october,2025:november,2025:december,2025:january,2025:february,2025:march,2025:april,2025:may,2025:june" || true
            python -m nbacomp.collect backfill-bref-months --months "2026:october,2026:november,2026:december,2026:january,2026:february,2026:march,2026:april,2026:may,2026:june" || true
            python -m nbacomp.collect verify-bref-months --months "2025:october,2025:november,2025:december,2025:january,2025:february,2025:march,2025:april,2025:may,2025:june" || true
            python -m nbacomp.collect verify-bref-months --months "2026:october,2026:november,2026:december,2026:january,2026:february,2026:march,2026:april,2026:may,2026:june" || true
          fi
          echo "games after bootstrap: $(python tools/db_game_count.py)"

      - name: Daily collection (schedule+odds, injuries, Kalshi, boxscores, verification)
        if: steps.skip.outputs.skip != 'true'
        run: |
          python -m nbacomp.collect kalshi-discovery || true
          python -m nbacomp.collect daily 2>&1 | tee data/daily.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Database report (row counts + collection health)
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        run: python tools/db_report.py --since "$RUN_START" || true

      - name: Pipeline (strategies, backtest, paper engine, settlement, audit, site)
        if: steps.skip.outputs.skip != 'true'
        run: |
          python tools/seed_research.py
          python tools/run_pipeline.py

      - name: Fail the run if a collector crashed
        if: steps.skip.outputs.skip != 'true'
        run: |
          # A crashed collector is a code defect, not a data condition: the job
          # must not report success while the database it publishes is missing
          # whatever that task was supposed to write. Runs after the site
          # build so the site (with its anomaly banner) is still published and
          # committed by the step below.
          python tools/db_report.py --since "$RUN_START" > data/db_report.txt
          cat data/db_report.txt
          if grep -q "collector crashes recorded (since .*): [1-9]" data/db_report.txt; then
            echo "::error::collector crashed during this run — see data/db_report.txt"
            exit 1
          fi

      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        run: python tools/probe_sources.py || true

      - name: Commit (data + site, or diagnostics on failure)
        if: steps.skip.outputs.skip != 'true' && (success() || failure())
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/nbacomp.db ]; then python tools/db_checkpoint.py || true; fi
          rm -f data/nbacomp.db-wal data/nbacomp.db-shm
          # -A data/ also commits data/db_report.txt (the row-count + crash
          # report) and data/diagnostics.txt (probe output), so every run's
          # evidence is inspectable from the repository afterwards.
          git add -A data index.html leaderboard.html strategies.html upcoming.html \
            positions.html history.html sources.html research.html methodology.html \
            style.css || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "[auto] collect + pipeline + site build $(date -u +%FT%TZ)" || true
            # concurrent runs race here (2026-09-21: a probe commit landed
            # mid-run and the bare push died silently). Rebase-then-push so
            # collection results survive; a final failure still exits 0 and
            # the next scheduled run re-collects.
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            git push origin HEAD || (sleep 30 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD) || true
          fi
